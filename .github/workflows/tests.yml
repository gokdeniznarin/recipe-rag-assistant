name: tests

# Her push ve pull request'te çalışır. Dal adı yazılmadı: bugün varsayılan dal
# `firebase-auth`, ileride `main` olacak — filtre koysaydık taşınma sırasında
# CI sessizce hiç koşmayan bir hâle düşerdi.
on: [push, pull_request]

jobs:
  python:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 üretimdeki sürüm (Dockerfile: python:3.13-slim). 3.12 ileriye
        # dönük bir uyarı ağı — bir bağımlılığın sürüme özel davranışı olursa
        # burada görünür.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt

      - name: Run tests
        # Testler ağa ÇIKMIYOR: conftest firebase/firestore/gemini'yi sys.modules
        # üzerinden, ChromaDB'yi patch ile sahteliyor. Dolayısıyla CI'da API
        # anahtarı gerekmiyor.
        run: python -m pytest -q

      - name: Embedded database unchanged
        # ChromaDB bir klasörü AÇARKEN BİLE chroma.sqlite3'e yazıyor. conftest
        # bunu engelliyor ama koruma sessizce bozulabilir — o zaman commit'li
        # 73MB'lık dosya her test koşusunda değişir. Bu adım onu yakalar.
        run: git diff --exit-code --stat -- api/chroma_data

  frontend:
    name: frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # JS için test çatısı yok (sade tarayıcı JS'i). Bu script sözdizimini ve
      # HTML↔JS element eşleşmesini kontrol ediyor — ikisi de bu projede gerçek,
      # sayfayı komple düşüren hatalar yakaladı.
      - name: Static checks
        run: node scripts/check_frontend.js

      # camera.js iki sayfanın paylaştığı bir durum makinesi ve şimdiye kadar
      # içinde iki gerçek hata çıktı. Sözdizimi kontrolü onları göremezdi.
      - name: Camera module behaviour
        run: node scripts/test_camera.js

      # sw.js sayfanın DIŞINDA, kendi thread'inde çalışıyor: hatası konsolda
      # görünmüyor, "çevrimdışı açılmıyor" ya da (çok daha kötüsü) "başka
      # kullanıcının verisi önbellekte" diye sessizce ortaya çıkıyor.
      - name: Service worker behaviour
        run: node scripts/test_sw.js

      # Giriş formu artık GİZLİ başlıyor ve auth.js onu açıyor. Açma yolu
      # bozulursa form hiç görünmez ve kimse giriş yapamaz — üstelik sayfa
      # hatasız göründüğü için sessizce. Ayrıca burası Faz 6'daki giriş↔search
      # sonsuz yönlendirme döngüsünün yaşandığı yer.
      - name: Login gate behaviour
        run: node scripts/test_auth_gate.js

      # Pinterest ve Google bir sayfadan SADECE bu etiketleri okuyor, ve
      # etiketler ekranda görünmüyor: bozulduklarında uygulama kusursuz
      # çalışmaya devam eder, pin'ler sessizce görselsiz/başlıksız çıkar.
      # Ayrıca `suitableForDiet`'in ASLA yayınlanmadığını sabitliyor —
      # diyet etiketlerimizin iki ölçülmüş hatası var ve yapılandırılmış
      # veride "otomatik tahmin" uyarısı basacak yer yok.
      - name: SEO / Rich Pin metadata
        run: node scripts/test_seo_meta.js

      # Tarif sayfası artık giriş yapmamış ziyaretçiye açık. O istisna iki
      # yönde de sessizce bozulur: gevşerse korumalı sayfalar herkese açılır,
      # sıkışırsa Pinterest trafiği kapıda geri döner. Ayrıca hangi HTML'lerin
      # kendini "açık" ilan ettiğini sabitliyor — işaretin kopyala-yapıştır ile
      # başka bir sayfaya sızması hiçbir şeyi kırmaz, sadece o sayfayı açar.
      - name: Auth guard (public vs protected pages)
        run: node scripts/test_auth_guard.js
