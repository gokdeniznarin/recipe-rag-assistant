<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pin sheet — Recipe Assistant</title>
<!--
  PIN GORSELI URETICI (Faz 29, adim 7).

  NASIL KULLANILIR
    1. Fotograflari `scripts/photos/` klasorune koy: `<slug>.jpg`
       (orn. `scripts/photos/cookies.jpg`). Fotografi olmayan koleksiyon
       otomatik olarak TIPOGRAFIK tasarima dusuyor - yani hepsini bulmak
       zorunda degilsin, elindekiyle basla.
    2. Bu dosyayi tarayicida ac (cift tik yeterli)
    3. Her karta sag tik -> Inspect -> secili dugumde sag tik ->
       "Capture node screenshot"  =>  tam 1000x1500 PNG

  MARKA ISARETI
    Pindeki ikon ve arkadaki susleme `frontend/icons/` altindaki GERCEK
    dosyalardan geliyor (kopyalanmiyor). Yani ikon bir daha degisirse
    - once `python scripts/make_icons.py` calistirilir -
    bu arac otomatik olarak yeni sekli basar; pinleri yeniden yakalamak yeter.

  FOTOGRAFLARI NEREDEN
    Unsplash (unsplash.com) ve Pexels (pexels.com) - ikisi de TICARI
    kullanima acik, atif zorunlu degil. "pasta", "cookies", "breakfast"
    gibi ara, indir, slug adiyla kaydet.

  🔴 FOOD.COM FOTOGRAFLARI KULLANILAMAZ. Veri seti CC0 ama bu, yukleyenin
  SAHIP OLMADIGI fotograflari kapsamiyor (CC0 deed'inin "Other Information"
  bolumu zaten bunu soyluyor). Uygulamanin ICINDE gostermek hotlink -
  baytlari onlarin CDN'i sunuyor, standart web davranisi. Kendi board'umuza
  YUKLEMEK ise kopyalamak. Ikisi ayni sey degil.

  ⚠️ FOTOGRAF KATEGORIYI temsil ediyor, belirli bir tarifi DEGIL. Bu
  editoryal olarak normal - ama "Vegan Recipes" pinine et fotografi koymak
  degil. Fotograf koleksiyonun ICERIGIYLE tutarli olmali.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Palet uygulamanin css/style.css'inden birebir. */
    --olive: #2D3B2D;
    --cream: #F5F0E8;
    --accent: #E8824A;
  }
  body {
    margin: 0; padding: 2rem; background: #333;
    font-family: 'Inter', sans-serif; color: var(--cream);
  }
  .sheet { display: flex; flex-wrap: wrap; gap: 2rem; }
  #status { margin: 0 0 1.5rem; font-size: 0.9rem; line-height: 1.6; }
  #status b { color: #ffd8a8; }

  /* Pinterest'in formati: dikey 2:3. */
  .pin {
    width: 1000px; height: 1500px; flex: 0 0 auto;
    background: var(--olive); color: var(--cream);
    display: flex; flex-direction: column; justify-content: flex-end;
    box-sizing: border-box; position: relative; overflow: hidden;
  }

  /* ── Fotografli varyant ──────────────────────────────── */
  .pin-photo { position: absolute; inset: 0; object-fit: cover; width: 100%; height: 100%; }
  /* Metnin okunabilirligi FOTOGRAFA birakilamaz: acik bir fotografta krem
     yazi kaybolur. Alttan yukari koyu bir gecis her fotografta ayni
     kontrasti garanti ediyor. */
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to top,
      rgba(24,32,24,0.94) 0%, rgba(24,32,24,0.86) 26%,
      rgba(24,32,24,0.35) 52%, rgba(24,32,24,0.10) 100%);
  }
  .content { position: relative; padding: 0 90px 110px; }

  /* ── Fotografsiz (tipografik) varyant ────────────────── */
  .pin--text { justify-content: space-between; padding: 110px 90px; }
  /* `.pin`in TEK cocugu `.content` (susleme `absolute`, akista degil), yani
     `.pin`deki space-between hicbir sey yapmiyordu: baslik da alt blok da uste
     yigiliyor, pinin alt yarisi bos kaliyordu. Ayirma isi buraya tasindi. */
  .pin--text .content {
    padding: 0; flex: 1;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  /* Sussleme = MARKA ISARETININ KENDISI, `frontend/icons/olive-branch.svg`
     dosyasindan. Sekil buraya KOPYALANMIYOR: o dosyayi scripts/olive_branch.py
     uretiyor ve tek kaynak orasi; kopyalasaydik ikon bir daha degistiginde
     pinler sessizce eski sekilde kalirdi (tam da su an duzeltilen durum).
     Dosya turuncu ciziyor, biz krem istiyoruz -> brightness(0) her pikseli
     siyaha indiriyor, invert(1) beyaza ceviriyor; saydamlik korunuyor. */
  .ornament {
    position: absolute; right: -230px; bottom: -300px;
    width: 1020px; height: 1020px;
    filter: brightness(0) invert(1);
    opacity: 0.085;
  }
  .pin:not(.pin--text) .ornament { display: none; }   /* fotografta sus gurultu olur */

  .kicker {
    font-size: 34px; font-weight: 600; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--accent);
  }
  .title {
    font-family: 'Playfair Display', serif; font-weight: 700;
    font-size: 132px; line-height: 1.04; margin: 34px 0 30px;
    text-shadow: 0 2px 24px rgba(0,0,0,0.35);
  }
  .desc {
    font-size: 42px; line-height: 1.45; max-width: 24ch;
    color: rgba(245, 240, 232, 0.9);
  }
  /* Marka ve adres YAN YANA DEGIL alt alta: uzun slug'larda ("vegetarian-
     dinners") adres 940 px istiyor, oysa yazi alani 820 px - yan yana
     dizilince ikisi de sarip birbirine giriyordu. */
  .foot {
    display: flex; flex-direction: column; align-items: flex-start; gap: 16px;
    margin-top: 46px; position: relative;
  }
  .pin--text .foot { margin-top: 0; }
  .brand {
    display: flex; align-items: center; gap: 22px; white-space: nowrap;
    font-family: 'Playfair Display', serif; font-size: 46px;
  }
  /* Uygulamanin GERCEK ikonu (beyaz zemin uzerinde zeytin dali). Cizgi
     surumu burada KULLANILAMAZDI: olive_branch.py'nin notu net, ~28 px'te
     sekil okunmuyor - kucuk bir marka isaretine dolu surum gerekiyor. */
  .brand-icon {
    width: 78px; height: 78px; border-radius: 19px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.3);
  }
  .url { font-size: 30px; color: rgba(245, 240, 232, 0.62); }
  .cap { font-size: 12px; color: #aaa; margin: 6px 0 0; max-width: 1000px; word-break: break-all; }
  /* Tek pin modunda sayfa = pinin kendisi; altyazi kadraja girmemeli. */
  body.single .cap { display: none; }
  .cap b { color: #7ec87e; }
</style>
</head>
<body>
  <p id="status">Loading collections…</p>
  <div id="sheet" class="sheet"></div>

<script>
const SITE = 'recipe-rag-assistant.vercel.app';

// ⚠️ LISTE BURAYA GOMULU, API'den CEKILMIYOR. Ilk surum `fetch` ile
// localhost:8080'e gidiyordu ve BU CALISMIYORDU: dosya cift tikla acildiginda
// sayfanin origin'i `null` oluyor, CORS istegi blokluyor ve sayfa bos kaliyor.
// (Test edilmeden "cift tik yeterli" denmisti.) Gomulu liste araci hicbir seye
// bagimli birakmiyor - docker bile gerekmiyor.
//
// `api/discover.py`'nin KOPYASI. Yeni bir koleksiyon eklenirse buraya da
// eklenmeli; bu bir sanat uretim araci, ayrisma en fazla "o pin uretilmez"
// demek. (plan.js'teki SLOTS kopyasiyla ayni tercih.)
const COLLECTIONS = [
  { slug: '30-minute-dinners', title: '30-Minute Dinners', description: 'Real dinners you can get on the table in half an hour.' },
  { slug: '15-minute-recipes', title: '15-Minute Recipes', description: 'For the nights when cooking has to be quick.' },
  { slug: 'easy-desserts', title: 'Easy Desserts', description: 'Sweet things that do not take an afternoon.' },
  { slug: 'breakfast-ideas', title: 'Breakfast Ideas', description: 'Ways to start the day that are not cereal.' },
  { slug: 'chicken-dinners', title: 'Chicken Dinners', description: 'The weeknight staple, done a lot of different ways.' },
  { slug: 'one-pot-meals', title: 'One-Pot Meals', description: 'Everything in one dish, and one dish to wash.' },
  { slug: 'homemade-bread', title: 'Homemade Bread', description: 'Loaves, quick breads and everything in between.' },
  { slug: 'cookies', title: 'Cookies', description: 'Drop cookies, bars, and the rest of the jar.' },
  { slug: 'vegetable-sides', title: 'Vegetable Sides', description: 'The part of the plate that usually gets ignored.' },
  { slug: 'potato-recipes', title: 'Potato Recipes', description: 'Roasted, mashed, baked and fried.' },
  { slug: 'lunch-and-snacks', title: 'Lunch & Snacks', description: 'Midday food worth looking forward to.' },
  { slug: 'drinks', title: 'Drinks', description: 'Hot, cold, and everything you can put in a glass.' },
  { slug: 'vegetarian-dinners', title: 'Vegetarian Dinners', description: 'Meat-free meals that are actually dinner, not a side salad.' },
  { slug: 'vegan-recipes', title: 'Vegan Recipes', description: 'No meat, no dairy, no eggs. Nothing that tastes like a compromise.' },
];

// Pinterest'te insanlar tarif degil NIYET ariyor; pinin ust satiri o niyeti
// soyluyor. Basligin kendisi kategoriyi, bu satir "ne zaman lazim olur"u
// anlatiyor.
const KICKERS = {
  '30-minute-dinners': 'weeknight',
  '15-minute-recipes': 'in a hurry',
  'easy-desserts': 'something sweet',
  'breakfast-ideas': 'mornings',
  'chicken-dinners': 'the usual, better',
  'one-pot-meals': 'one pan',
  'homemade-bread': 'from scratch',
  'cookies': 'the cookie jar',
  'vegetable-sides': 'on the side',
  'potato-recipes': 'comfort',
  'lunch-and-snacks': 'midday',
  'drinks': 'in a glass',
  'vegetarian-dinners': 'meat-free',
  'vegan-recipes': 'fully plant-based',
};

const esc = (s) => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

/** `photos/<slug>.<ext>` var mi? Ilk bulunani dondur, yoksa null. */
function findPhoto(slug) {
  const tries = ['jpg', 'jpeg', 'png', 'webp'].map((e) => `photos/${slug}.${e}`);
  return new Promise((resolve) => {
    let i = 0;
    const next = () => {
      if (i >= tries.length) return resolve(null);
      const img = new Image();
      const src = tries[i++];
      img.onload = () => resolve(src);
      img.onerror = next;
      img.src = src;
    };
    next();
  });
}

(async () => {
  const status = document.getElementById('status');
  // Hata olursa sayfa "Loading collections..." diye asili kalmasin — sebebi
  // ekranda gorunsun. (Ilk surumde `KICKERS` silinmisti ve sayfa sessizce
  // takilmisti; konsolu acmadan anlamak mumkun degildi.)
  window.addEventListener('error', (e) => {
    status.textContent = 'HATA: ' + e.message;
    status.style.color = '#ff8080';
  });
  // TEK PIN MODU: `make_pins.html?pin=cookies` yalnizca o pini, sayfayi tam
  // dolduracak sekilde cizer. Sebebi otomatik yakalama: bu adresi headless
  // Chrome'a `--window-size=1000,1500` ile verince tam olcude bir PNG cikiyor,
  // yani 14 pin icin 14 kez DevTools acip "Capture node screenshot" tiklamak
  // gerekmiyor. Elle yakalama yolu aynen duruyor - bu onun yerine gecmiyor.
  const only = new URLSearchParams(location.search).get('pin');
  const collections = only ? COLLECTIONS.filter((c) => c.slug === only) : COLLECTIONS;
  if (only) {
    document.body.classList.add('single');
    document.body.style.padding = '0';
    status.style.display = 'none';
    if (!collections.length) {
      status.style.display = '';
      status.textContent = 'Boyle bir slug yok: ' + only;
      status.style.color = '#ff8080';
      return;
    }
  }

  const sheet = document.getElementById('sheet');
  let withPhoto = 0;
  const missing = [];

  for (const c of collections) {
    const photo = await findPhoto(c.slug);
    if (photo) withPhoto++; else missing.push(c.slug);

    const wrap = document.createElement('div');
    // ⚠️ `utm_*` PIN URL'INE ELLE EKLENMIYOR: hedef adresi Pinterest'e
    // yuklerken sen yaziyorsun. Buradaki metin yalnizca gorselde okunan
    // adres, tiklanabilir bir link degil.
    wrap.innerHTML = `
      <div class="pin ${photo ? '' : 'pin--text'}" data-slug="${esc(c.slug)}">
        ${photo ? `<img class="pin-photo" src="${esc(photo)}" alt=""><div class="scrim"></div>` : ''}
        <img class="ornament" src="../frontend/icons/olive-branch.svg" alt="" onerror="this.remove()">
        <div class="content">
          <div>
            <p class="kicker">${esc(KICKERS[c.slug] || 'recipes')}</p>
            <h1 class="title">${esc(c.title)}</h1>
            <p class="desc">${esc(c.description)}</p>
          </div>
          <div class="foot">
            <span class="brand">
              <!-- Yuklenemezse KIRIK IKON basmaktansa yalniz metin kalsin:
                   yayinlanan bir pinde kirik gorsel isareti geri alinamaz. -->
              <img class="brand-icon" src="../frontend/icons/icon-192.png" alt="" onerror="this.remove()">
              Recipe Assistant
            </span>
            <span class="url">${SITE}/discover/${esc(c.slug)}</span>
          </div>
        </div>
      </div>
      <p class="cap">${photo ? '<b>photo</b>' : 'typographic'} · ${esc(c.slug)}.png<br>
        ${SITE}/discover/${esc(c.slug)}?utm_source=pinterest&amp;utm_medium=pin&amp;utm_campaign=${esc(c.slug)}</p>`;
    sheet.appendChild(wrap);
  }

  status.innerHTML =
    `${collections.length} pins · <b>${withPhoto} with a photo</b>, ${missing.length} typographic<br>` +
    (missing.length
      ? `No photo yet (typographic layout): <b>${esc(missing.join(' · '))}</b><br>` +
        `Drop images into <b>scripts/photos/&lt;slug&gt;.jpg</b> to swap any of them to the photo layout.<br>`
      : `Every collection has a photo.<br>`) +
    `Right-click a card → Inspect → right-click the highlighted node → <b>Capture node screenshot</b> (1000×1500)`;
})();
</script>
</body>
</html>
