services:
  # ChromaDB servisi kaldırıldı (Faz 9): tarifler image'a gömülü (Faz 8), favoriler
  # Firestore'a taşındı. Çalışma anında yazılan veri kalmadığı için ayrı bir veritabanı
  # servisine ve kalıcı disk'e gerek yok. Bkz. CLAUDE.md → "şekil sorunu".
  api:
    # Tek Dockerfile repo kökünde (HF Spaces de onu kullanıyor). Context kök,
    # çünkü Dockerfile api/ dışına referans vermiyor ama build'in kökten
    # çalışması HF ile birebir aynı image'ı üretiyor.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recipe_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-key.json
      # Container varsayılan olarak UTC kullanıyor; log saatleri kendi saatimizden
      # 3 saat geride görünüyor ve "yeni log gelmemiş" izlenimi veriyordu.
      # Sadece yerel geliştirme kolaylığı — canlıda (Render) UTC kalması normal.
      - TZ=Europe/Istanbul
    volumes:
      # Firebase service-account anahtarı — repo'ya girmez (.gitignore), salt-okunur mount
      - ./api/firebase-key.json:/run/secrets/firebase-key.json:ro

  frontend:
    build: ./frontend
    container_name: recipe_frontend
    ports:
      - "3000:80"
    volumes:
      # Geliştirme kolaylığı: frontend dosyalarını canlı mount et — JS/HTML
      # değişince rebuild gerekmez, tarayıcıyı yenilemek yeterli.
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api