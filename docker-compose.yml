services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: recipe_chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  api:
    build: ./api
    container_name: recipe_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
    depends_on:
      - chromadb

  frontend:
    build: ./frontend
    container_name: recipe_frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  chroma_data: