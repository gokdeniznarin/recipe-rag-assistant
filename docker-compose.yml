services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: recipe_chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  api:
    build: ./api
    container_name: recipe_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-key.json
    volumes:
      # Firebase service-account anahtarı — repo'ya girmez (.gitignore), salt-okunur mount
      - ./api/firebase-key.json:/run/secrets/firebase-key.json:ro
    depends_on:
      - chromadb

  frontend:
    build: ./frontend
    container_name: recipe_frontend
    ports:
      - "3000:80"
    volumes:
      # Geliştirme kolaylığı: frontend dosyalarını canlı mount et — JS/HTML
      # değişince rebuild gerekmez, tarayıcıyı yenilemek yeterli.
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  chroma_data: