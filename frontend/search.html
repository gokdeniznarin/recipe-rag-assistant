<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search — Recipe Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="has-sidebar">

  <!-- Mobil üst bar: yalnızca dar ekranda görünür (CSS) -->
  <div class="mobile-bar">
    <button id="nav-toggle" class="nav-toggle" aria-label="Open menu"
            aria-controls="sidebar" aria-expanded="false">☰</button>
    <a href="search.html" class="brand">
      <span class="brand-mark">✦</span>
      <span class="brand-name">Recipe Assistant</span>
    </a>
  </div>
  <div id="nav-overlay" class="nav-overlay hidden"></div>

  <!-- Sidebar. Gruplar akış zincirini görünür kılıyor:
       Pantry → Plan → Shopping (elimde ne var → ne pişireceğim → ne almalıyım) -->
  <aside id="sidebar" class="sidebar">
    <a href="search.html" class="brand">
      <span class="brand-mark">✦</span>
      <span class="brand-name">Recipe Assistant</span>
    </a>

    <nav class="side-nav">
      <a href="search.html" class="side-link side-link--primary">Search</a>

      <p class="side-heading">Kitchen</p>
      <a href="pantry.html" class="side-link">Pantry</a>
      <a href="plan.html" class="side-link">Meal plan</a>
      <a href="shopping.html" class="side-link">Shopping list</a>

      <p class="side-heading">Tools</p>
      <a href="nutrition.html" class="side-link">Nutrition</a>

      <p class="side-heading">Saved</p>
      <a href="favorites.html" class="side-link">Your recipes</a>
    </nav>

    <div class="side-user">
      <div class="side-user-row">
        <span id="user-avatar" class="user-avatar"></span>
        <span id="user-email" class="side-user-email">…</span>
      </div>
      <button id="logout-btn" class="side-signout">Sign out</button>
    </div>
  </aside>

  <!-- Ana içerik -->
  <main class="page">
    <section class="search-hero">
      <h1 class="page-title">Find your next meal</h1>
      <p class="page-sub">Describe what you want, or show us what's in your fridge.</p>
    </section>

    <!-- Metin / Kamera / Dolap sekmeleri -->
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="text">Text search</button>
      <button class="mode-tab" data-mode="camera">Camera search</button>
      <button class="mode-tab" data-mode="pantry">From my pantry</button>
    </div>

<!-- Metin sekmesi -->
<section id="text-panel" class="search-panel">
  <form id="text-form" class="search-form">
    <div class="search-input-wrap">
      <input
        type="text"
        id="text-query"
        class="search-input"
        placeholder='Try "gluten free quick chicken dinner"'
        required
      />
      <button type="button" id="mic-btn" class="mic-btn" aria-label="Voice search" title="Search by voice">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
      </button>
    </div>
    <button type="submit" class="btn-accent">Search</button>
  </form>
</section>

    <!-- Kamera sekmesi -->
    <section id="camera-panel" class="search-panel hidden">
      <div class="camera-block">
        <video id="camera-preview" class="camera-preview" autoplay playsinline></video>
        <canvas id="camera-canvas" class="hidden"></canvas>

        <div class="camera-controls">
          <button id="start-camera-btn" class="btn-outline">Start camera</button>
          <button id="capture-btn" class="btn-accent hidden">Take photo</button>
          <button id="retake-btn" class="btn-outline hidden">Retake</button>
        </div>

        <div id="detected-ingredients" class="detected-box hidden">
          <div class="detected-row">
            <span class="detected-label">Detected:</span>
            <span id="detected-list" class="detected-list"></span>
          </div>
          <!-- Kamerayı kalıcı hale getiren adım: tanınanları dolaba kaydet -->
          <div class="detected-actions">
            <button type="button" id="add-detected-btn" class="btn-outline btn-sm">
              ＋ Add to pantry
            </button>
            <span id="add-detected-status" class="detected-status"></span>
          </div>
        </div>

        <form id="camera-form" class="search-form hidden">
          <input
            type="text"
            id="camera-extra"
            class="search-input"
            placeholder="Add optional text (e.g. 'quick and vegetarian')"
          />
          <button type="submit" class="btn-accent">Search with photo</button>
        </form>
      </div>
    </section>

    <!-- Dolap sekmesi -->
    <section id="pantry-panel" class="search-panel hidden">
      <div class="camera-block">
        <div id="pantry-summary" class="detected-box">
          <div class="detected-row">
            <span class="detected-label">In your pantry:</span>
            <span id="pantry-summary-list" class="detected-list">Loading…</span>
          </div>
          <div class="detected-actions">
            <a href="pantry.html" class="pantry-manage-link">Manage pantry →</a>
          </div>
        </div>

        <form id="pantry-form" class="search-form">
          <input
            type="text"
            id="pantry-extra"
            class="search-input"
            placeholder="Add optional text (e.g. 'quick and vegetarian')"
          />
          <button type="submit" id="pantry-search-btn" class="btn-accent">Find recipes</button>
        </form>
      </div>
    </section>

    <!-- Yükleniyor durumu -->
    <div id="loading" class="loading hidden">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>

    <!-- Sonuçlar -->
    <section id="results" class="results hidden">
      <!-- AI yorumu aramadan ayrı bir istekle gelir; o gelene kadar iskelet gösterilir -->
      <div class="llm-answer hidden" id="llm-box">
        <p class="llm-eyebrow">Assistant</p>
        <p id="llm-text" class="llm-text"></p>
        <div id="llm-skeleton" class="llm-skeleton" aria-hidden="true">
          <span class="skeleton-line"></span>
          <span class="skeleton-line"></span>
          <span class="skeleton-line short"></span>
        </div>
      </div>

      <div class="results-header">
        <h2 class="results-title">Recipes</h2>
        <span id="results-count" class="results-count"></span>
      </div>

      <div id="recipe-list" class="recipe-list"></div>
    </section>

    <!-- Hata mesajı -->
    <div id="search-error" class="page-error hidden"></div>
  </main>

  <!-- Firebase (compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/logger.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
