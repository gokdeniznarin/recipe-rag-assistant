<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favorites — Recipe Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="app-header-inner">
      <a href="search.html" class="brand">
        <span class="brand-mark">✦</span>
        <span class="brand-name">Recipe Assistant</span>
      </a>
      <nav class="app-nav">
  <a href="favorites.html" class="nav-link">Favorites</a>
  
  <div class="user-menu">
    <button id="user-btn" class="user-btn">
      <span id="user-email">…</span>
      <span class="chevron">▾</span>
    </button>
    <div id="user-dropdown" class="user-dropdown hidden">
      <button id="logout-btn" class="dropdown-item">Sign out</button>
    </div>
  </div>
</nav>
    </div>
  </header>

  <main class="page">
    <section class="search-hero">
      <h1 class="page-title">Your recipes</h1>
      <p class="page-sub">Everything you've saved, organized your way.</p>
    </section>

    <!-- Yükleniyor -->
    <div id="loading" class="loading">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>

    <!-- Koleksiyonlar -->
    <section id="collections-section" class="collections-section hidden">
      <h2 class="section-heading">Collections</h2>
      <div id="collections-grid" class="collections-grid">
        <!-- Koleksiyon kartları buraya + "New collection" kutucuğu -->
        <button id="new-collection-tile" class="collection-tile collection-tile--new">
          <span class="collection-tile-plus">＋</span>
          <span class="collection-tile-name">New collection</span>
        </button>
      </div>

      <!-- Yeni koleksiyon adı girişi (kutucuğa tıklayınca açılır) -->
      <form id="new-collection-form" class="new-collection-form hidden">
        <input id="new-collection-input" class="search-input" type="text"
               maxlength="60" placeholder="Collection name (e.g. Breakfast)" />
        <button type="submit" class="btn-accent btn-sm">Create</button>
        <button type="button" id="new-collection-cancel" class="btn-outline btn-sm">Cancel</button>
      </form>
      <p id="new-collection-error" class="inline-error hidden"></p>
    </section>

    <!-- All Saved başlığı (favori varken görünür) -->
    <h2 id="saved-heading" class="section-heading hidden">All saved</h2>

    <!-- Boş durum -->
    <div id="empty-state" class="empty-state hidden">
      <div class="empty-icon">♡</div>
      <h2 class="empty-title">No saved recipes yet</h2>
      <p class="empty-text">Save recipes from search results to see them here.</p>
      <a href="search.html" class="btn-accent empty-btn">Start searching</a>
    </div>

    <!-- Liste -->
    <div id="favorites-list" class="recipe-list hidden"></div>

    <!-- Hata -->
    <div id="favorites-error" class="page-error hidden"></div>
  </main>

  <!-- Firebase (compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/logger.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/favorites.js"></script>
</body>
</html>
