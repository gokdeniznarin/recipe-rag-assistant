<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-hero">
      <p class="auth-eyebrow">AI-powered recipe discovery</p>
      <h1 class="auth-headline"><em>What's in<br>your kitchen?</em></h1>
      <p class="auth-sub">Describe ingredients or take a photo — get recipes that actually fit what you have.</p>
    </div>

    <div class="auth-card">
      <div class="tab-row">
        <button class="tab-btn active" data-tab="login">Sign in</button>
        <button class="tab-btn" data-tab="register">Create account</button>
      </div>

      <!-- Login formu -->
      <form id="login-form" class="auth-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-primary">Sign in</button>
        <p class="form-error" id="login-error"></p>
      </form>

      <!-- Register formu -->
      <form id="register-form" class="auth-form hidden">
        <div class="field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn-primary">Create account</button>
        <p class="form-error" id="register-error"></p>
        <p class="form-success hidden" id="register-success">Account created! You can sign in now.</p>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
