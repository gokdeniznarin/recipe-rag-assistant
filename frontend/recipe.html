<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipe — Recipe Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="app-header-inner">
      <a href="search.html" class="brand">
        <span class="brand-mark">✦</span>
        <span class="brand-name">Recipe Assistant</span>
      </a>
      <nav class="app-nav">
  <a href="plan.html" class="nav-link">Plan</a>
  <a href="pantry.html" class="nav-link">Pantry</a>
  <a href="shopping.html" class="nav-link">Shopping</a>
  <a href="nutrition.html" class="nav-link">Nutrition</a>
  <a href="favorites.html" class="nav-link">Favorites</a>
  
  <div class="user-menu">
    <button id="user-btn" class="user-btn">
      <span id="user-email">…</span>
      <span class="chevron">▾</span>
    </button>
    <div id="user-dropdown" class="user-dropdown hidden">
      <button id="logout-btn" class="dropdown-item">Sign out</button>
    </div>
  </div>
</nav>
    </div>
  </header>

  <main class="page">
    <a href="search.html" class="back-link">← Back to search</a>

    <!-- Yükleniyor -->
    <div id="loading" class="loading">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>

    <!-- Tarif -->
    <article id="recipe" class="recipe-detail hidden">
      <!-- Kapak görseli (Faz 20). Görsel yoksa ya da link ölmüşse JS bu
           kutuyu tamamen gizliyor — sayfa eskisi gibi görünür. -->
      <figure id="recipe-hero" class="recipe-hero hidden">
        <img id="recipe-hero-img" src="" alt="" />
      </figure>

      <header class="recipe-header">
        <p id="recipe-category" class="recipe-category"></p>
        <div class="recipe-title-row">
          <h1 id="recipe-title" class="recipe-title"></h1>
          <button id="favorite-btn" class="favorite-btn" aria-label="Add to favorites">
            <span class="heart">♡</span>
          </button>
        </div>
        <div id="recipe-tags" class="recipe-tags-detail"></div>

        <!-- Koleksiyona ekle / plana ekle -->
        <div class="recipe-actions">
          <div class="collection-picker-wrap">
            <button id="add-collection-btn" class="btn-outline btn-sm" type="button">
              ＋ Add to collection
            </button>
            <div id="collection-picker" class="collection-picker hidden">
              <div id="picker-list" class="picker-list">
                <p class="picker-empty">Loading…</p>
              </div>
              <form id="picker-new-form" class="picker-new">
                <input id="picker-new-input" type="text" maxlength="60"
                       placeholder="New collection…" />
                <button type="submit" class="btn-accent btn-sm">Create</button>
              </form>
              <p id="picker-error" class="inline-error hidden"></p>
            </div>
          </div>

          <button id="add-plan-btn" class="btn-outline btn-sm" type="button">
            ＋ Add to plan
          </button>
        </div>
        <p id="plan-status" class="plan-status hidden"></p>
      </header>

      <!-- Bilgi çubuğu -->
      <div class="info-strip">
        <div class="info-cell">
          <span class="info-label">Time</span>
          <span id="info-time" class="info-value">—</span>
        </div>
        <div class="info-cell">
          <span class="info-label">Calories</span>
          <span id="info-calories" class="info-value">—</span>
        </div>
        <div class="info-cell">
          <span class="info-label">Protein</span>
          <span id="info-protein" class="info-value">—</span>
        </div>
        <div class="info-cell">
          <span class="info-label">Carbs</span>
          <span id="info-carbs" class="info-value">—</span>
        </div>
        <div class="info-cell">
          <span class="info-label">Fat</span>
          <span id="info-fat" class="info-value">—</span>
        </div>
      </div>

      <!-- İçerik alanı -->
      <section class="recipe-section">
        <h2 class="section-title">About</h2>
        <p id="recipe-description" class="recipe-description"></p>
      </section>

      <section class="recipe-section">
        <h2 class="section-title">Ingredients</h2>
        <ul id="recipe-ingredients" class="ingredients-list"></ul>
      </section>

      <section class="recipe-section">
        <h2 class="section-title">Instructions</h2>
        <ol id="recipe-instructions" class="instructions-list"></ol>
      </section>
    </article>

    <div id="recipe-error" class="page-error hidden"></div>
  </main>

  <!-- Plana ekle: gün + öğün seçimi -->
  <div id="plan-modal" class="modal-overlay hidden">
    <div class="modal">
      <h3 class="modal-title">Add to your plan</h3>
      <p class="modal-text">Pick a day and a meal.</p>

      <div class="plan-modal-field">
        <label for="plan-day">Day</label>
        <select id="plan-day" class="plan-select"></select>
      </div>

      <div class="plan-modal-field">
        <label for="plan-slot">Meal</label>
        <select id="plan-slot" class="plan-select">
          <option value="breakfast">Breakfast</option>
          <option value="lunch">Lunch</option>
          <option value="dinner">Dinner</option>
        </select>
      </div>

      <p id="plan-modal-error" class="inline-error hidden"></p>
      <div class="modal-actions">
        <button id="plan-cancel" class="btn-outline btn-sm">Cancel</button>
        <button id="plan-confirm" class="btn-accent btn-sm">Add to plan</button>
      </div>
    </div>
  </div>

  <!-- Firebase (compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/logger.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/recipe.js"></script>
</body>
</html>
