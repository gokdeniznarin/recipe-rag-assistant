<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meal plan — Recipe Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="app-header-inner">
      <a href="search.html" class="brand">
        <span class="brand-mark">✦</span>
        <span class="brand-name">Recipe Assistant</span>
      </a>
      <nav class="app-nav">
  <a href="plan.html" class="nav-link">Plan</a>
  <a href="pantry.html" class="nav-link">Pantry</a>
  <a href="shopping.html" class="nav-link">Shopping</a>
  <a href="nutrition.html" class="nav-link">Nutrition</a>
  <a href="favorites.html" class="nav-link">Favorites</a>

  <div class="user-menu">
    <button id="user-btn" class="user-btn">
      <span id="user-email">…</span>
      <span class="chevron">▾</span>
    </button>
    <div id="user-dropdown" class="user-dropdown hidden">
      <button id="logout-btn" class="dropdown-item">Sign out</button>
    </div>
  </div>
</nav>
    </div>
  </header>

  <main class="page">
    <section class="search-hero">
      <h1 class="page-title">Your meal plan</h1>
      <p class="page-sub">Plan the week ahead. Tap any slot to pick a recipe.</p>
    </section>

    <!-- Hafta gezinme -->
    <div class="week-bar">
      <button id="prev-week" class="icon-btn" type="button" aria-label="Previous week">←</button>
      <div class="week-bar-center">
        <span id="week-label" class="week-label">…</span>
        <button id="this-week" class="link-btn hidden" type="button">Back to this week</button>
      </div>
      <button id="next-week" class="icon-btn" type="button" aria-label="Next week">→</button>
    </div>

    <div class="week-tools">
      <span id="week-count" class="results-count"></span>
      <div class="week-tools-right">
        <a id="shopping-link" class="link-btn" href="shopping.html">Shopping list →</a>
        <button id="clear-week-btn" class="pantry-clear-btn hidden" type="button">Clear week</button>
      </div>
    </div>

    <!-- Yükleniyor -->
    <div id="loading" class="loading">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>

    <!-- Hafta ızgarası (JS dolduruyor) -->
    <div id="week-grid" class="week-grid hidden"></div>

    <!-- Hata -->
    <div id="plan-error" class="page-error hidden"></div>
  </main>

  <!-- Tarif seçici (boş slota tıklayınca) -->
  <div id="picker-modal" class="modal-overlay hidden">
    <div class="modal modal--wide">
      <h3 id="picker-title" class="modal-title">Pick a recipe</h3>
      <p class="modal-text">From your saved recipes.</p>

      <div id="picker-recipes" class="plan-picker-list">
        <p class="picker-empty">Loading…</p>
      </div>

      <p id="picker-modal-error" class="inline-error hidden"></p>
      <div class="modal-actions">
        <button id="picker-cancel" class="btn-outline btn-sm">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Haftayı temizleme onayı (yıkıcı işlem — pantry/koleksiyon deseni) -->
  <div id="clear-modal" class="modal-overlay hidden">
    <div class="modal">
      <h3 class="modal-title">Clear this week?</h3>
      <p class="modal-text">
        This removes <span id="clear-count">all</span> from this week.
        Your saved recipes are not affected.
      </p>
      <div class="modal-actions">
        <button id="clear-cancel" class="btn-outline btn-sm">Cancel</button>
        <button id="clear-confirm" class="btn-accent btn-sm">Clear week</button>
      </div>
    </div>
  </div>

  <!-- Firebase (compat SDK) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/logger.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/plan.js"></script>
</body>
</html>
