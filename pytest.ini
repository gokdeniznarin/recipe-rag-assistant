[pytest]
# api/ ve ingestion/ düz klasörler (__init__.py yok) ve importlar çıplak
# ("from filters import ...", "from clean_data import ..."). Bu ayar olmadan
# test dosyaları hiçbir şeyi import edemez.
pythonpath = api ingestion

# testpaths OPSİYONEL DEĞİL: sınırlanmazsa pytest ingestion/test_search.py'yi de
# toplamaya çalışır. O dosya test değil, elle çalıştırılan bir script ve import
# anında PersistentClient açıyor — ChromaDB bir klasörü açarken bile
# chroma.sqlite3'e yazdığı için commit'li 35MB'lık veritabanı kirlenir ve
# git'te sahte bir değişiklik çıkar.
testpaths = api/tests ingestion/tests

# Katman 2'de FastAPI TestClient (Starlette) httpx'i kullanıyor ve her import'ta
# bir StarletteDeprecationWarning basıyor — davranışsal değil, sadece gürültü.
# Test çıktısı temiz kalsın diye susturuluyor.
filterwarnings =
    ignore:Using .httpx. with .starlette

# Windows notu: konsol cp1254 kullandığı için Türkçe karakterli test/xfail
# mesajları bozuk görünür (çökme değil, sadece görüntü). Düzeltmek için:
#   PowerShell → $env:PYTHONIOENCODING = "utf-8"
# Linux/container'da gerekmiyor.
